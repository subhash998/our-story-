<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S & S - Our Story</title>
  <!-- Google Fonts for typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #080203;
      color: #fce8e8;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Fixed Header Navigation */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 50px;
      z-index: 100;
      background: linear-gradient(180deg, rgba(8, 2, 3, 0.8) 0%, rgba(8, 2, 3, 0) 100%);
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #e5c192;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo span {
      color: #e61938;
      font-size: 1.1rem;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      color: #d1c2c2;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 1px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ff3366;
    }

    .music-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .music-btn:hover {
      border-color: #ff3366;
      color: #ff3366;
    }

    /* Landing Section */
    #landing {
      min-height: 100vh;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 100px;
      text-align: center;
      /* Glowing night background */
      background: radial-gradient(circle at 50% 15%, #3d0c18 0%, #080203 65%);
    }

    /* Moon Graphic */
    .moon {
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, #fffef0 20%, #f3deaa 70%, #d8b775 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(243, 222, 170, 0.6), 0 0 80px rgba(243, 222, 170, 0.2);
      margin-bottom: 25px;
    }

    /* Title Styling */
    .landing-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 400;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 15px;
    }

    .landing-title .highlight-red {
      color: #e61938;
    }

    .landing-title .cursive-title {
      font-family: 'Alex Brush', cursive;
      color: #e61938;
      font-size: 3.2rem;
      font-weight: 400;
    }

    .title-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 10px 0;
      color: #d8b775;
      font-size: 0.8rem;
    }

    .title-divider::before,
    .title-divider::after {
      content: '';
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d8b775, transparent);
    }

    /* Days Badge */
    .days-badge {
      font-size: 0.7rem;
      letter-spacing: 2.5px;
      color: #c9a3a8;
      text-transform: uppercase;
      margin-top: 5px;
      margin-bottom: 8px;
    }

    /* Gold Cursive Subheading */
    .anniversary-text {
      font-family: 'Alex Brush', cursive;
      font-size: 2.8rem;
      color: #f7d794;
      text-shadow: 0 0 15px rgba(247, 215, 148, 0.5);
      margin-bottom: 40px;
    }

    /* Action Button */
    .btn-container {
      margin-top: 10px;
      margin-bottom: 30px;
      z-index: 10;
    }

    .btn-glow {
      background: rgba(138, 12, 33, 0.6);
      color: #ffffff;
      border: 1px solid #e61938;
      padding: 12px 35px;
      border-radius: 30px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 25px rgba(230, 25, 56, 0.6), inset 0 0 10px rgba(230, 25, 56, 0.4);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-glow:hover {
      background: rgba(230, 25, 56, 0.8);
      box-shadow: 0 0 35px rgba(230, 25, 56, 0.9);
      transform: translateY(-2px);
    }

    /* Mouse Scroll Icon */
    .scroll-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #8a7b7c;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 60px;
    }

    .mouse-icon {
      width: 18px;
      height: 28px;
      border: 1px solid #8a7b7c;
      border-radius: 12px;
      position: relative;
    }

    .mouse-icon::before {
      content: '';
      width: 2px;
      height: 5px;
      background: #8a7b7c;
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Bottom Curved White Section */
    .curved-bottom {
      width: 100%;
      background: #fdfaf7;
      color: #4a3b32;
      padding: 60px 20px;
      border-top-left-radius: 50% 40px;
      border-top-right-radius: 50% 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
    }

    .quote-icon {
      color: #d8b775;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .quote-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.1rem;
      line-height: 1.8;
      color: #635349;
      max-width: 450px;
    }

    .heart-small {
      color: #e61938;
      font-size: 0.8rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <div class="logo">S <span>&#9829;</span> S</div>
    <nav>
      <a href="#landing">Our Story</a>
      <a href="#">Memories</a>
      <a href="#">Gallery</a>
      <a href="#">Surprises</a>
      <a href="#">Future</a>
    </nav>
    <button class="music-btn" title="Toggle Music">&#9835;</button>
  </header>

  <!-- Hero Landing Section -->
  <section id="landing">
    <!-- Moon -->
    <div class="moon"></div>

    <!-- Title -->
    <h1 class="landing-title">
      Every <span class="highlight-red">love</span> story is beautiful...<br>
      but ours is my <span class="cursive-title">favorite.</span> <span class="highlight-red">&#9825;</span>
    </h1>

    <div class="title-divider">&#9825;</div>

    <!-- Days Counter -->
    <div class="days-badge">730 DAYS OF LOVE, LAUGHTER & MEMORIES</div>

    <!-- Gold Cursive Header -->
    <div class="anniversary-text">Happy 2 Year Anniversary</div>

    <!-- Begin Story Button -->
    <div class="btn-container">
      <a href="#quote-section" class="btn-glow">
        BEGIN OUR STORY <span style="color:#ff3366;">&#9829;</span>
      </a>
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
      <div class="mouse-icon"></div>
      <div>SCROLL TO BEGIN</div>
      <div style="color: #e61938; font-size: 0.5rem;">&#9829;</div>
    </div>

    <!-- Curved White Quote Area -->
    <div id="quote-section" class="curved-bottom">
      <div class="quote-icon">&#8220;&#8220;</div>
      <p class="quote-text">
        Two souls. One heart.<br>
        Countless memories. One forever.
      </p>
      <div class="heart-small">&#9825;</div>
    </div>
  </section>

</body>
</html>
